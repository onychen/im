name: Deploy backend guide to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/backend-guide/**"
      - ".github/workflows/backend-guide-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-guide-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static tutorial
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/backend-guide
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
