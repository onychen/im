<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>实验 05 · API 贯通</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2313765a%27/%3E%3Ctext x=%278%27 y=%2724%27 fill=%27white%27 font-size=%2724%27 font-family=%27monospace%27%3EG%3C/text%3E%3C/svg%3E"><style>
body{max-width:720px;margin:40px auto;padding:0 20px;font:16px/1.7 system-ui;background:#faf9f6;color:#25231f}h1{font-size:26px}label{display:block;margin:12px 0}input{font:inherit;padding:7px;border:1px solid #bbb;max-width:100%;box-sizing:border-box}button{padding:9px 14px;margin:8px 5px 8px 0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#eee9df;min-height:110px}#base{width:100%}small{color:#777}button:disabled{opacity:.5}
</style></head><body><h1>让一个请求走完整条链路</h1><p>仅连接你本机的实验 05 服务。开发账户为 lesson / lesson123；令牌只保存在当前页面内存，刷新后重新登录。</p>
<label>后端地址<input id="base" value="http://localhost:18101"></label>
<button id="login">1. 登录</button><button id="read">2. 获取资料</button>
<label>昵称<input id="nickname" value="后端学习者" maxlength="20"></label><label><input id="enabled" type="checkbox" checked> 开启通知</label>
<button id="save">3. 更新资料</button><button id="clear">清除令牌，观察 401</button>
<p><small>在浏览器 Network 中保留日志，观察 OPTIONS、Authorization、HTTP 状态、JSON 业务码和 X-Request-ID。</small></p><pre id="result" role="status">先启动后端，然后点击登录。</pre>
<script>
let token='';const $=id=>document.getElementById(id);
async function request(path, method='GET', body){
 const headers={};if(token)headers.Authorization='Bearer '+token;if(body!==undefined)headers['Content-Type']='application/json';
 try{
  const response=await fetch($('base').value.replace(/\/$/,'')+'/api/v1'+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
  const isJSON=response.headers.get('content-type')?.includes('application/json');
  const data=isJSON?await response.json():{message:await response.text()};
  $('result').textContent=JSON.stringify({http_status:response.status,request_id:response.headers.get('X-Request-ID'),body:path==='/auth/login'&&data.code===0?{...data,data:{expires_in:data.data.expires_in,access_token:'已保存到页面内存'}}:data},null,2);
  if(!response.ok||data.code!==0)throw new Error(data.message||'接口响应失败');
  return data.data;
 }catch(error){if(error instanceof TypeError)$('result').textContent='浏览器未取得可读响应：检查服务、地址、Origin 和 Network 中的预检结果。';throw error;}
}
async function run(button,work){button.disabled=true;try{await work();}catch{}finally{button.disabled=false;}}
$('login').onclick=()=>run($('login'),async()=>{token='';const result=await request('/auth/login','POST',{username:'lesson',password:'lesson123'});token=result.access_token;});
$('read').onclick=()=>run($('read'),async()=>{const data=await request('/profile');$('nickname').value=data.nickname;$('enabled').checked=data.notification_enabled;});
$('save').onclick=()=>run($('save'),async()=>{await request('/profile','PUT',{nickname:$('nickname').value,notification_enabled:$('enabled').checked});});
$('clear').onclick=()=>{token='';$('result').textContent='令牌已清除。点击获取资料，应看到 HTTP 401。';};
</script></body></html>
