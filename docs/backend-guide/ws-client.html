<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoIM · 本机 WebSocket 实验台</title><link rel="stylesheet" href="style.css"><style>main{max-width:900px;margin:35px auto;padding:24px}.fields{display:grid;gap:15px}.fields label{display:grid;gap:5px}.fields input,.fields textarea{padding:10px;font:14px Consolas,monospace;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:5px;width:100%}.fields textarea{min-height:150px}.actions{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}#log{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--code-bg);color:var(--code-text);padding:18px;border-radius:5px;min-height:180px;font:13px/1.8 Consolas,monospace}.hint{color:var(--muted);font-size:14px}</style><main><a href="index.html#chapter13">回到完整私聊章节</a><h1 style="margin-top:20px">本机 WebSocket 实验台</h1><p>连接你自己运行的 GoIM 服务。这是真实请求，可能产生聊天消息。为 Alice、Bob 分别打开此页，使用各自 token。</p><p class="hint">推荐下载页面后在本机打开，或从本地教程地址打开。在线 HTTPS 页连接 ws:// 可能被浏览器阻止；此时使用本地页面或已配置的 wss:// 服务。token 只保存在当前页面内存。</p><div class="fields"><label>WebSocket 服务地址<input id="url" value="ws://localhost:18080/ws"></label><label>当前用户 access_token<input id="token" type="password" autocomplete="off" placeholder="粘贴登录返回的访问令牌"></label><label>目标用户或群 ID<input id="target" type="number" min="1" value="2"></label><label>完整 JSON 帧<textarea id="payload"></textarea></label></div><div class="actions"><button id="connect" class="primary">连接</button><button id="disconnect" disabled>断开</button><button id="private">生成私聊帧</button><button id="group">生成群聊帧</button><button id="sync">生成同步帧</button><button id="send" disabled>发送当前帧</button><button id="clear">清空日志</button></div><div id="status" role="status">尚未连接</div><pre id="log" aria-label="收发日志"></pre><script>
(() => {'use strict';const $=id=>document.getElementById(id);let ws=null;const log=(type,data)=>{const node=$('log');node.textContent+=new Date().toLocaleTimeString()+' '+type+' '+data+'\n';node.scrollTop=node.scrollHeight};const state=(text,open)=>{$('status').textContent=text;$('send').disabled=!open;$('disconnect').disabled=!ws||ws.readyState>1;$('connect').disabled=!!ws&&ws.readyState<2};const frame=convType=>{const toId=Number($('target').value);if(!Number.isSafeInteger(toId)||toId<1){log('错误','请输入真实目标 ID');return}$('payload').value=JSON.stringify({type:'msg',data:{msgId:'lesson-'+crypto.randomUUID(),convType,toId,msgType:1,content:'你好 GoIM',timestamp:Date.now()}},null,2)};$('private').onclick=()=>frame(1);$('group').onclick=()=>frame(2);$('sync').onclick=()=>{$('payload').value=JSON.stringify({type:'syncReq',data:{lastSyncTime:0,lastSyncMsgId:0,batchSize:50}},null,2)};frame(1);$('connect').onclick=()=>{try{const url=new URL($('url').value);if(!['ws:','wss:'].includes(url.protocol))throw Error('服务地址必须使用 ws:// 或 wss://');if(!$('token').value.trim())throw Error('请填写 access_token');url.searchParams.set('token',$('token').value.trim());ws=new WebSocket(url);state('连接中',false);ws.onopen=()=>{state('已连接',true);log('连接','WebSocket 已建立')};ws.onmessage=event=>log('收到',event.data);ws.onerror=()=>log('错误','连接失败：检查服务、token、Origin 或混合内容限制');ws.onclose=event=>{state('已断开（'+event.code+'）',false);log('关闭',String(event.code))}}catch(err){log('错误',err.message)}};$('disconnect').onclick=()=>ws?.close();$('send').onclick=()=>{if(!ws||ws.readyState!==WebSocket.OPEN)return;try{const value=JSON.parse($('payload').value);ws.send(JSON.stringify(value));log('发送',JSON.stringify(value))}catch(err){log('错误',err.message)}};$('clear').onclick=()=>{$('log').textContent=''};window.addEventListener('beforeunload',()=>ws?.close());})();
</script></main></html>
